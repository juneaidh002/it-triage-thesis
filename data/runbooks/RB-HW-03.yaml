id: RB-HW-03
title: Screen, keyboard or physical damage
category: Laptop hardware
owner: Hardware
applies_when: Laptop has a cracked screen, broken keys or other physical damage
pre_checks:
- Asset tag is known
steps:
- Collect the asset tag and a short description of the damage
- Advise the user to back up files if the device still works
- Open a hardware repair request
- Route to the Hardware team
allowed_actions:
- create_hardware_request
- assign_to_team
escalate_if:
- Always needs a human decision on repair or replacement
auto_resolvable: false
verification:
  status: not_verifiable_company_specific
  checked_against: []
  notes: Depends on the organization's own systems, catalogs or approval process, so public documentation cannot verify it. Needs review by someone who knows the real service desk process.
aliases:
- cracked screen
- broken keyboard
- laptop damaged
- dropped my laptop
- keys not working
- screen broken or flickering
- liquid spilled on the laptop
