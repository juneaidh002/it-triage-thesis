id: RB-VPN-02
title: VPN slow or disconnecting
category: VPN and remote access
owner: Network
applies_when: VPN connects but is slow or drops repeatedly
pre_checks:
- User is working remotely
- Other internet use works
steps:
- Check local internet speed
- Move closer to the router or use a wired connection
- Close heavy downloads and video streams
- Reconnect to a different VPN gateway
allowed_actions:
- check_service_status
- send_instructions
escalate_if:
- Problem persists on more than one network
- Several users report drops at the same time
auto_resolvable: true
escalation_note: When escalating, include when the problem started, whether others are affected, the steps already tried, and the exact error text or a screenshot
verification:
  status: checked_generic_guides_only
  checked_against:
  - 'ISCTE-IUL IT: VPN troubleshooting guide (university guide, not vendor) | https://informatica.iscte-iul.pt/?p=91863'
  - 'Cycle.io: VPN troubleshooting guide (generic) | https://cycle.io/learn/vpn-troubleshooting'
  notes: Existing steps match generic guides (change server, reduce load). No vendor-specific source used.
