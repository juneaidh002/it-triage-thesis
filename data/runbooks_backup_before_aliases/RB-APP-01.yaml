id: RB-APP-01
title: Internal application login error
category: Internal application errors
owner: App support
applies_when: User cannot sign in to an internal business application
pre_checks:
- Correct address is used
- Account is active
steps:
- Confirm the application address
- Check the application status
- Sign in using single sign-on
- Clear browser cache or try another browser
allowed_actions:
- check_service_status
- send_instructions
escalate_if:
- Message says access denied or role missing
- Application is down for all users
auto_resolvable: true
verification:
  status: not_verifiable_company_specific
  checked_against: []
  notes: Depends on the organization's own systems, catalogs or approval process, so public documentation cannot verify it. Needs review by someone who knows the real service desk process.
must_mention: a login error or failed sign-in to an application they already have access to
